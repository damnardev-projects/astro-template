name: Compile and Verify

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  compile-verify:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run check

      - name: Lint project
        run: npm run lint

      - name: Build project
        run: npm run build